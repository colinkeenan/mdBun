<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- A bun fresh from the oven, with the Markdown mark (M and down arrow, CC0 by Dustin Curtis)
       on its front. Plain paths and gradients only: no clip-path or <use>, which some viewers
       (QtSvg) do not draw. -->
  <defs>
    <!-- crust: toasted brown on top, through orange, to pale gold where it sat on the tray -->
    <linearGradient id="crust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a3d12"/>
      <stop offset=".3" stop-color="#c4661c"/>
      <stop offset=".6" stop-color="#e8952f"/>
      <stop offset="1" stop-color="#f8cf7a"/>
    </linearGradient>
    <radialGradient id="toast" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#5e2607" stop-opacity=".75"/>
      <stop offset="1" stop-color="#5e2607" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <path d="M128 50C112 32 86 28 66 42 34 64 12 108 12 152c0 52 48 76 116 76s116-24 116-76c0-44-22-88-54-110-20-14-46-10-62 8z" fill="url(#crust)"/>
  <!-- the darkest toasting, on the crown of each half -->
  <ellipse cx="84" cy="92" rx="44" ry="32" fill="url(#toast)"/>
  <ellipse cx="176" cy="90" rx="44" ry="32" fill="url(#toast)"/>
  <!-- the split between the halves, pale where the dough opened -->
  <path d="M128 50c2 22 12 36 8 60" fill="none" stroke="#fbe3a0" stroke-width="11" stroke-linecap="round"/>
  <path d="M121 54c2 20 10 32 8 52" fill="none" stroke="#a04c14" stroke-width="3" stroke-linecap="round"/>
  <!-- glaze shining -->
  <path d="M40 104c6-22 20-38 38-46" fill="none" stroke="#ffe9a8" stroke-width="11" stroke-linecap="round" opacity=".85"/>
  <path d="M168 50c16 2 28 10 36 22" fill="none" stroke="#ffe9a8" stroke-width="9" stroke-linecap="round" opacity=".7"/>
  <path d="M128 50C112 32 86 28 66 42 34 64 12 108 12 152c0 52 48 76 116 76s116-24 116-76c0-44-22-88-54-110-20-14-46-10-62 8z" fill="none" stroke="#45190a" stroke-width="9" stroke-linejoin="round"/>
  <g transform="translate(47 108) scale(.78)">
    <rect width="208" height="128" rx="16"/>
    <path d="M30 98V30h20l20 25 20-25h20v68H90V59L70 84 50 59v39zm125 0l-30-33h20V30h20v35h20z" fill="#fff"/>
  </g>
</svg>
