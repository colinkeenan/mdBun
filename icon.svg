<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- A bun fresh from the oven, with the M and down arrow of the Markdown mark (CC0 by Dustin
       Curtis) raised on its front. Plain paths and gradients only: no clip-path or <use>,
       which some viewers (QtSvg) do not draw. -->
  <defs>
    <!-- crust: toasted brown on top, through orange, to pale gold where it sat on the tray -->
    <linearGradient id="crust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a3d12"/>
      <stop offset=".3" stop-color="#c4661c"/>
      <stop offset=".6" stop-color="#e8952f"/>
      <stop offset="1" stop-color="#f8cf7a"/>
    </linearGradient>
    <radialGradient id="toast" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#5e2607" stop-opacity=".75"/>
      <stop offset="1" stop-color="#5e2607" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="raised" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#ffe6ad"/>
    </linearGradient>
  </defs>
  <path d="M118 48C103 26 76 20 58 35 30 59 12 108 12 152c0 52 48 76 116 76s116-24 116-76c0-42-19-83-47-105-22-16-60-17-79 1z" fill="url(#crust)"/>
  <!-- the darkest toasting, on the crown of each half -->
  <ellipse cx="84" cy="92" rx="44" ry="32" fill="url(#toast)"/>
  <ellipse cx="176" cy="90" rx="44" ry="32" fill="url(#toast)"/>
  <!-- the split between the halves, pale where the dough opened -->
  <path d="M118 48c9 13 30 31 29 60" fill="none" stroke="#fbe3a0" stroke-width="11" stroke-linecap="round"/>
  <path d="M111 52c9 13 27 29 27 54" fill="none" stroke="#a04c14" stroke-width="3" stroke-linecap="round"/>
